<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Decryption - Jihan</title>
  <style>
    /* Global Styles & Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e0b1f 0%, #0d040e 70%, #050106 100%);
      color: #f7e7f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cinzel", "Playfair Display", Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px 12px;
    }

    /* Falling Flowers Canvas */
    #flower-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 22px;
    }

    /* Top Card Preview */
    .top-card {
      width: 100%;
      height: 70px;
      border-radius: 20px;
      border: 1px solid rgba(224, 168, 190, 0.25);
      background: linear-gradient(180deg, rgba(35, 14, 38, 0.6) 0%, rgba(15, 5, 18, 0.8) 100%);
      box-shadow: 0 0 25px rgba(184, 98, 138, 0.15);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10px;
      position: relative;
      overflow: hidden;
    }

    .top-card::before {
      content: "";
      position: absolute;
      top: -10px;
      width: 60%;
      height: 20px;
      background: radial-gradient(ellipse at center, rgba(243, 198, 219, 0.4), transparent 70%);
    }

    .stars-badge {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      color: #ebd1df;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Section Subtitle with Floral Accents */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.78rem;
      letter-spacing: 0.35em;
      color: #e5b3c9;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .floral-symbol {
      font-size: 0.95rem;
      color: #f3a8c6;
      filter: drop-shadow(0 0 6px rgba(243, 168, 198, 0.6));
    }

    /* Main Name Display Card (Fixed for Mobile Wrapping) */
    .name-card {
      position: relative;
      width: 100%;
      padding: 38px 16px;
      border-radius: 22px;
      border: 1px solid rgba(230, 170, 195, 0.35);
      background: rgba(22, 8, 25, 0.75);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 35px rgba(210, 120, 160, 0.2), inset 0 0 15px rgba(255, 192, 218, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* SVG Floral Corner Flourishes */
    .floral-corner {
      position: absolute;
      width: 32px;
      height: 32px;
      opacity: 0.7;
      pointer-events: none;
    }

    .corner-tl { top: 8px; left: 8px; }
    .corner-tr { top: 8px; right: 8px; transform: scaleX(-1); }
    .corner-bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
    .corner-br { bottom: 8px; right: 8px; transform: scale(-1); }

    /* Fix: Forces the name onto a single row without wrapping on mobile */
    .name-text {
      font-family: "Cinzel", "Playfair Display", Georgia, serif;
      font-weight: 700;
      white-space: nowrap; /* Prevents text breaking into multiple lines */
      word-break: keep-all;
      /* Dynamic sizing to gracefully fit 320px–480px viewports */
      font-size: clamp(1.8rem, 7vw, 3.1rem);
      letter-spacing: clamp(0.12em, 2vw, 0.38em);
      padding-left: clamp(0.12em, 2vw, 0.38em); /* Offsets first-letter letter-spacing centering */
      background: linear-gradient(135deg, #ffffff 0%, #ffe4ee 40%, #f7b3d1 75%, #e098be 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(248, 180, 210, 0.45));
      transition: all 0.3s ease;
    }

    /* Action Button */
    .decode-button {
      background: linear-gradient(180deg, rgba(38, 16, 40, 0.8) 0%, rgba(20, 7, 22, 0.9) 100%);
      border: 1px solid rgba(224, 160, 188, 0.5);
      border-radius: 50px;
      padding: 12px 28px;
      color: #f7d6e6;
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 18px rgba(184, 98, 138, 0.25);
      transition: all 0.3s ease;
    }

    .decode-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(235, 150, 190, 0.45);
      border-color: rgba(255, 190, 215, 0.8);
    }

    .decode-button:active {
      transform: translateY(0);
    }

    .lightning {
      color: #ffd875;
      font-size: 0.95rem;
    }

    /* Floral Center Divider */
    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 4px 0;
    }

    .divider-line {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(230, 160, 190, 0.4), transparent);
    }

    .divider-flower {
      color: #f3a8c6;
      font-size: 0.85rem;
      opacity: 0.85;
    }

    /* Quote Text */
    .quote {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-size: 0.98rem;
      line-height: 1.55;
      color: #ebd6e3;
      max-width: 320px;
      opacity: 0.92;
      text-shadow: 0 0 10px rgba(220, 140, 180, 0.2);
    }

    /* Bottom Music Player */
    .player-widget {
      width: 100%;
      max-width: 310px;
      background: rgba(26, 9, 28, 0.85);
      border: 1px solid rgba(220, 150, 180, 0.3);
      border-radius: 40px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(210, 110, 155, 0.2);
      margin-top: 6px;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f85b8c 0%, #e83e6f 100%);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(248, 91, 140, 0.5);
      transition: transform 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.06);
    }

    .track-info {
      display: flex;
      flex-direction: column;
      text-align: left;
      flex-grow: 1;
      margin-left: 14px;
    }

    .track-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
    }

    .track-status {
      font-size: 0.72rem;
      color: #d1a5be;
    }

    /* Equalizer Bars Animation */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .bar {
      width: 3px;
      background: #f85b8c;
      border-radius: 2px;
      animation: bounce 1.2s ease-in-out infinite alternate;
    }

    .bar1 { height: 60%; animation-delay: 0.1s; }
    .bar2 { height: 100%; animation-delay: 0.3s; }
    .bar3 { height: 40%; animation-delay: 0.5s; }

    .equalizer.paused .bar {
      animation-play-state: paused;
      height: 3px;
    }

    @keyframes bounce {
      0% { height: 20%; }
      100% { height: 100%; }
    }
  </style>
</head>
<body>

  <!-- Background Animated Petals & Stars Canvas -->
  <canvas id="flower-canvas"></canvas>

  <main class="container">
    <!-- Top Preview Header -->
    <div class="top-card">
      <span class="stars-badge">✦ STARS ✦</span>
    </div>

    <!-- Section Title -->
    <div class="section-title">
      <span class="floral-symbol">✿</span>
      <span>CELESTIAL DECRYPTION</span>
      <span class="floral-symbol">✿</span>
    </div>

    <!-- Main Name Display Container -->
    <div class="name-card">
      <!-- Decorative Floral SVG Flourishes -->
      <svg class="floral-corner corner-tl" viewBox="0 0 50 50" fill="none" stroke="#f3a8c6" stroke-width="2">
        <path d="M5,45 Q5,5 45,5 M12,25 Q12,12 25,12 M5,5 L15,15" opacity="0.8"/>
        <circle cx="22" cy="22" r="3" fill="#f3a8c6"/>
      </svg>
      <svg class="floral-corner corner-tr" viewBox="0 0 50 50" fill="none" stroke="#f3a8c6" stroke-width="2">
        <path d="M5,45 Q5,5 45,5 M12,25 Q12,12 25,12 M5,5 L15,15" opacity="0.8"/>
        <circle cx="22" cy="22" r="3" fill="#f3a8c6"/>
      </svg>
      <svg class="floral-corner corner-bl" viewBox="0 0 50 50" fill="none" stroke="#f3a8c6" stroke-width="2">
        <path d="M5,45 Q5,5 45,5 M12,25 Q12,12 25,12 M5,5 L15,15" opacity="0.8"/>
        <circle cx="22" cy="22" r="3" fill="#f3a8c6"/>
      </svg>
      <svg class="floral-corner corner-br" viewBox="0 0 50 50" fill="none" stroke="#f3a8c6" stroke-width="2">
        <path d="M5,45 Q5,5 45,5 M12,25 Q12,12 25,12 M5,5 L15,15" opacity="0.8"/>
        <circle cx="22" cy="22" r="3" fill="#f3a8c6"/>
      </svg>

      <!-- Fixed Single-Line Name Display -->
      <h1 id="name-display" class="name-text">J I H A N</h1>
    </div>

    <!-- Re-Decode Interactive Button -->
    <button id="decode-btn" class="decode-button">
      <span class="lightning">⚡</span> RE-DECODE CIPHER
    </button>

    <!-- Floral Line Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-flower">🌸</span>
      <div class="divider-line"></div>
    </div>

    <!-- Romantic Quote -->
    <p class="quote">
      A name forged in light, intuition, and rare authenticity.
    </p>

    <!-- Audio Player Bar -->
    <div class="player-widget">
      <button id="play-btn" class="play-btn" aria-label="Toggle Playback">
        <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>
      <div class="track-info">
        <span class="track-title">In the Pool</span>
        <span id="player-status" class="track-status">Now Playing</span>
      </div>
      <div id="equalizer" class="equalizer">
        <div class="bar bar1"></div>
        <div class="bar bar2"></div>
        <div class="bar bar3"></div>
      </div>
    </div>
  </main>

  <script>
    /* Animated Floating Flower Petals System */
    const canvas = document.getElementById('flower-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Petal {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 7 + 6;
        this.speedY = Math.random() * 0.9 + 0.4;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.02;
        this.opacity = Math.random() * 0.5 + 0.3;
        // Soft sakura rose gradient colors
        this.color = Math.random() > 0.4 ? '#fca5c5' : '#fce7f1';
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.angle += this.spin;

        if (this.y > height + 20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        
        // Draw petal shape
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size, -this.size, -this.size, this.size, 0, this.size * 1.5);
        ctx.bezierCurveTo(this.size, this.size, this.size, -this.size, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    const petals = Array.from({ length: 35 }, () => new Petal());

    function animatePetals() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      requestAnimationFrame(animatePetals);
    }
    animatePetals();

    /* Cipher Re-Decode Text Animation */
    const nameDisplay = document.getElementById('name-display');
    const decodeBtn = document.getElementById('decode-btn');
    const targetText = "J I H A N";
    const cipherChars = "✧✦✵🌸✿❀CJKLX0123456789";

    let isDecoding = false;

    decodeBtn.addEventListener('click', () => {
      if (isDecoding) return;
      isDecoding = true;

      let iterations = 0;
      const interval = setInterval(() => {
        nameDisplay.innerText = targetText
          .split("")
          .map((char, index) => {
            if (char === " ") return " ";
            if (index < iterations) return targetText[index];
            return cipherChars[Math.floor(Math.random() * cipherChars.length)];
          })
          .join("");

        if (iterations >= targetText.length) {
          clearInterval(interval);
          nameDisplay.innerText = targetText;
          isDecoding = false;
        }

        iterations += 1 / 3;
      }, 40);
    });

    /* Music Player Toggle Simulation */
    const playBtn = document.getElementById('play-btn');
    const playerStatus = document.getElementById('player-status');
    const equalizer = document.getElementById('equalizer');
    let isPlaying = true;

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playerStatus.innerText = "Now Playing";
        equalizer.classList.remove('paused');
        playBtn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>`;
      } else {
        playerStatus.innerText = "Paused";
        equalizer.classList.add('paused');
        playBtn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>`;
      }
    });
  </script>
</body>
</html>
