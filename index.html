<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Presentation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #ffffff;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #f8fafc;
        }

        p {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
        }

        .hidden-content {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        input::placeholder, textarea::placeholder {
            color: #94a3b8;
        }

        .submit-btn {
            background: #10b981;
            margin-top: 8px;
        }

        .submit-btn:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Special Interactive Message</h1>
        <p>Click the button below to reveal the hidden presentation message.</p>
        
        <button class="btn" id="revealBtn" onclick="toggleMessage()">Reveal Message</button>

        <div class="hidden-content" id="messageBox">
            <p style="font-weight: 600; color: #f472b6;">✨ You've unlocked the special message! ✨</p>
            
            <!-- Contact form directing submissions to your email -->
            <form action="https://formsubmit.co/mohammedhemmi@gmail.com" method="POST">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email Address" required>
                <textarea name="message" rows="3" placeholder="Write your message here..." required></textarea>
                
                <button type="submit" class="btn submit-btn">Send Direct Message</button>
            </form>
        </div>
    </div>

    <script>
        function toggleMessage() {
            const box = document.getElementById('messageBox');
            const btn = document.getElementById('revealBtn');
            if (box.style.display === 'block') {
                box.style.display = 'none';
                btn.textContent = 'Reveal Message';
            } else {
                box.style.display = 'block';
                btn.textContent = 'Hide Message';
            }
        }
    </script>
</body>
</html>
