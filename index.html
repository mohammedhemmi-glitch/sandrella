<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Dedicated Chapter</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0508;
            --card-bg: #150a11;
            --text-gold: #c6a36b;
            --text-silver: #a39c9f;
            --btn-glow: rgba(225, 178, 114, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Screen Transition Logic */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.8s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           SCREEN 2: THE DEDICATED CHAPTER (From Image)
           ========================================= */
        .dedicated-card {
            background-color: var(--card-bg);
            border: 1px solid #281622;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--text-gold);
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .name-title {
            font-size: 65px;
            margin: 0 0 20px 0;
            font-weight: 400;
            /* Cream to Pink Gradient */
            background: linear-gradient(to right, #fdf6e3 20%, #e88d95 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-text {
            font-style: italic;
            color: var(--text-silver);
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 50px;
        }

        .unseal-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .unseal-wrapper:hover {
            transform: translateY(-3px);
        }

        .j-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            /* Reddish-pink radial gradient */
            background: radial-gradient(circle at center, #b53855 0%, #7a1c30 100%);
            border: 2px solid #edc48c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 0 20px var(--btn-glow), inset 0 0 10px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            transition: box-shadow 0.3s ease;
        }

        .unseal-wrapper:hover .j-btn {
            box-shadow: 0 0 30px rgba(225, 178, 114, 0.8), inset 0 0 10px rgba(0,0,0,0.2);
        }

        .unseal-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--text-gold);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Basic styling for placeholder screens */
        .placeholder-content { text-align: center; }
        .next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: transparent;
            border: 1px solid var(--text-gold);
            color: var(--text-gold);
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         SCREEN 1: FISH AND BIRD STORY
         ========================================== -->
    <div id="screen-story" class="screen active">
        <div class="placeholder-content">
            <h2>The Story of the Fish and the Bird</h2>
            <p style="color: #a39c9f; font-style: italic;">(Paste your HTML/CSS for the story here)</p>
            
            <!-- This button triggers the transition to the main image page -->
            <button class="next-btn" onclick="navigateTo('screen-dedicated')">CONTINUE</button>
        </div>
    </div>


    <!-- ==========================================
         SCREEN 2: DEDICATED CHAPTER (From Image)
         ========================================== -->
    <div id="screen-dedicated" class="screen">
        <div class="dedicated-card">
            <div class="subtitle">A Dedicated Chapter</div>
            
            <h1 class="name-title">Jihan</h1>
            
            <p class="message-text">
                Not just another birthday message.<br>
                Take a moment. There's a little story waiting inside.
            </p>
            
            <!-- Clicking this wrapper unseals the card and goes to the principal page -->
            <div class="unseal-wrapper" onclick="navigateTo('screen-principal')">
                <div class="j-btn">J</div>
                <div class="unseal-text">Unseal</div>
            </div>
        </div>
    </div>


    <!-- ==========================================
         SCREEN 3: PRINCIPAL PAGE (Tasks & Texts)
         ========================================== -->
    <div id="screen-principal" class="screen">
        <div class="placeholder-content">
            <h2>Principal Page</h2>
            <p style="color: #a39c9f; font-style: italic;">(Paste your tasks, texts, and main content here)</p>
        </div>
    </div>


    <!-- JavaScript to handle the flow -->
    <script>
        function navigateTo(targetScreenId) {
            // Hide all screens
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => {
                screen.classList.remove('active');
            });

            // Show the targeted screen
            const targetScreen = document.getElementById(targetScreenId);
            if (targetScreen) {
                targetScreen.classList.add('active');
            }
        }
    </script>
</body>
</html>
